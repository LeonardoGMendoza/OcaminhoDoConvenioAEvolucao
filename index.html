    <script>
      window.onerror = function(msg, url, line, col, error) {
        var el = document.getElementById('erro-debug');
        el.style.display = 'block';
        el.innerText = 'ERRO: ' + msg + '\nLinha: ' + line + '\nArquivo: ' + url;
      };
      window.addEventListener('unhandledrejection', function(event) {
        var el = document.getElementById('erro-debug');
        el.style.display = 'block';
        el.innerText = 'ERRO (promise): ' + event.reason;
      });
    </script>
